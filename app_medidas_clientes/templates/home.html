<!DOCTYPE html>
<html>
<head>
    <title>Messa.Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
        }

        form {
            margin: 20px;
        }

        input[type="text"], input[type="email"], input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button[type="submit"] {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        h2 {
            color: #333;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin-bottom: 10px;
        }

    </style>
</head>
<body>
    <!-- Conteúdo comum a todas as páginas -->
    <nav>
        <a href="{% url 'registrar' %}">
            <button>Criar Conta</button>
        </a>
        
        <a href="{% url 'login' %}">
            <button>Login</button>
        </a>
    </nav>
</body>
</html>
